name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip buildozer cython==0.29.36

      - name: Configure buildozer.spec
        run: |
          buildozer init
          python3 -c '
          with open("buildozer.spec", "r") as f: spec = f.read()
          spec = spec.replace("title = My Application", "title = Wardrobe AI")
          spec = spec.replace("package.name = myapp", "package.name = wardrobeai")
          spec = spec.replace("package.domain = org.test", "package.domain = org.wardrobeai")
          spec = spec.replace("requirements = python3,kivy", "requirements = python3,kivy==2.3.0,kivymd==1.2.0,opencv,numpy,pyjnius,android,certifi")
          spec = spec.replace("#android.permissions = INTERNET", "android.permissions = CAMERA,INTERNET,ACCESS_NETWORK_STATE")
          spec = spec.replace("#android.api = 31", "android.api = 33")
          spec = spec.replace("#android.minapi = 21", "android.minapi = 24")
          spec = spec.replace("#android.archs = arm64-v8a, armeabi-v7a", "android.archs = arm64-v8a")
          spec = spec.replace("#android.accept_sdk_license = False", "android.accept_sdk_license = True")
          spec = spec.replace("source.include_exts = py,png,jpg,kv,atlas", "source.include_exts = py,png,jpg,kv,atlas,json,onnx,xml")
          with open("buildozer.spec", "w") as f: f.write(spec)
          '

      - name: Build APK
        run: yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wardrobe-AI-APK
          path: bin/*.apk
