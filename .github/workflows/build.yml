name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure buildozer.spec
        run: |
          pip install buildozer cython==0.29.36
          buildozer init
          cat << 'EOF' >> buildozer.spec

          [app]
          title = Wardrobe AI
          package.name = wardrobeai
          package.domain = org.wardrobeai
          source.include_exts = py,png,jpg,kv,atlas,json,onnx,xml
          requirements = python3,kivy==2.3.0,kivymd==1.2.0,pillow,setuptools,numpy,opencv,pyjnius,android,certifi
          android.permissions = CAMERA,INTERNET,ACCESS_NETWORK_STATE
          android.api = 33
          android.minapi = 24
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          p4a.branch = release-2024.01.21

          [buildozer]
          log_level = 2
          EOF

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wardrobe-AI-APK
          path: bin/*.apk
